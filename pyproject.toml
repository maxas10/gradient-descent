[project]
name = "gradient"
version = "0.1.0"
description = "gradient visualization"
readme = "README.md"
authors = [
    { name = "maxas10", email = "maxaseung@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[project.scripts]
gradient = "gradient:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
